name: 桌面端构建与发布

# 触发方式：
#   1) 推送 v* 标签（如 v1.0.0）-> 构建 + 自动发布 GitHub Release
#   2) 推送/PR 到 master    -> 仅构建校验，产出物作为 Artifact 下载
#   3) Actions 页面手动运行（workflow_dispatch）
#
# 注意：所有 action 均使用 node24 运行时的最新版本（Node 20 已弃用），
#      需要 Actions Runner v2.327.1 或更高。

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write # 发布 Release 需要

jobs:
  build:
    runs-on: windows-latest # 桌面端当前仅支持 Windows

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 准备 Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt "pyinstaller>=6.0"

      - name: 运行测试
        run: python -m pytest tests -q

      - name: 打包桌面端
        run: pyinstaller --noconfirm yuanjisong.spec

      - name: 冒烟验证（headless 启动 exe 并访问本地服务）
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist -Recurse -Filter *.exe | Select-Object -First 1
          if (-not $exe) { throw "未找到打包产物 exe" }
          # headless 模式：CI 无交互桌面，跳过 WebView2 窗口，仅验证服务与依赖可用
          $env:DESKTOP_HEADLESS = "1"
          $p = Start-Process -FilePath $exe.FullName -PassThru
          try {
            $ok = $false
            for ($i = 0; $i -lt 30; $i++) {
              if ($p.HasExited) { break }
              Start-Sleep -Seconds 2
              try {
                $r = Invoke-WebRequest -Uri "http://127.0.0.1:8765/api/data" -UseBasicParsing -TimeoutSec 5
                if ($r.StatusCode -eq 200) { $ok = $true; break }
              } catch { }
            }
            if (-not $ok) {
              if ($p.HasExited) { "exe 已退出，退出码: $($p.ExitCode)" }
              "=== desktop_error.log ==="
              Get-Content (Join-Path (Split-Path $exe.FullName) "desktop_error.log") -ErrorAction SilentlyContinue
              "=== 端口监听 ==="
              Get-NetTCPConnection -State Listen -ErrorAction SilentlyContinue |
                Where-Object { $_.LocalPort -ge 8765 -and $_.LocalPort -le 8770 } |
                Format-Table LocalPort, OwningProcess | Out-String
              throw "exe 启动后本地服务无响应"
            }
            "smoke: /api/data HTTP 200"
          } finally {
            if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          }

      - name: 压缩产物
        shell: pwsh
        run: Compress-Archive -Path "dist\*" -DestinationPath "猿急送筛选系统-${{ github.ref_name }}.zip"

      - name: 上传构建产物（非 tag 触发时）
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v7
        with:
          name: desktop-windows
          path: 猿急送筛选系统-*.zip
          retention-days: 30

      # 用 GitHub CLI 发布：gh 为运行器内置，不经过 Node 运行时，无第三方 action 依赖
      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $zip = Get-ChildItem -Path . -Filter "猿急送筛选系统-*.zip" | Select-Object -First 1
          if (-not $zip) { throw "未找到待发布的 zip 产物" }
          gh release create "${{ github.ref_name }}" $zip.Name `
            --title "${{ github.ref_name }}" --generate-notes
