name: 桌面端构建与发布

# 推送 v* 标签 -> 发布 Release；推送 master 或手动运行 -> 仅构建，产物在 Artifacts

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 安装依赖并打包
        run: |
          python -m pip install -r requirements.txt "pyinstaller>=6.0"
          pyinstaller --noconfirm yuanjisong.spec

      # 注意：CI 脚本内一律使用 ASCII 文件名（Windows 运行器脚本编码会丢弃非 ASCII 字符）
      - name: 压缩产物
        shell: pwsh
        run: Compress-Archive -Path "dist\*" -DestinationPath "yuanjisong-desktop-${{ github.ref_name }}.zip"

      - name: 上传产物（非 tag 触发时）
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v7
        with:
          name: desktop-windows
          path: yuanjisong-desktop-*.zip

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $zip = Get-ChildItem -Filter "yuanjisong-desktop-*.zip" | Select-Object -First 1
          if (-not $zip) { throw "zip artifact not found" }
          gh release create "${{ github.ref_name }}" $zip.Name --generate-notes
